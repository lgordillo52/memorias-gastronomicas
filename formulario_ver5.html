<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4ea8e" />
    <meta name="description" content="Comparte una receta, su preparación y las memorias que la acompañan en Memoria Gastronómica." />
    <title>Comparte tu receta · Memoria Gastronómica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet" />
    <style>
:root {
  --yellow: #f4ea8e;
  --ink: #171213;
  --paper: #dadada;
  --hand: "Lilita One", "Arial Rounded MT Bold", sans-serif;
  --mono: "DM Mono", "Courier New", monospace;
  --sans: "DM Sans", Arial, sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background: var(--yellow);
  color: var(--ink);
  font-family: var(--sans);
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }

.site-header, main { position: relative; z-index: 1; }

.site-header {
  display: flex;
  align-items: center;
  flex-direction: column;
}

.top-nav {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  width: min(668px, calc(100% - 36px));
  height: 96px;
  margin-top: 22px;
  padding: 12px 15px;
  border: 5px solid #1b1617;
  border-radius: 19px 22px 18px 21px;
  background: #181415;
  box-shadow: -3px 2px 0 #292324 inset;
}

.nav-item {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
  min-width: 0;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--yellow);
  font-family: var(--sans);
  font-size: clamp(16px, 1.42vw, 30px);
  font-weight: 400;
  text-decoration: none;
  transition: background-color 160ms ease, color 160ms ease;
}

a.nav-item:hover, a.nav-item:focus-visible,
button.nav-item:hover, button.nav-item:focus-visible {
  background: #353031;
  outline-offset: 4px;
}

.nav-item--active {
  color: var(--ink);
  background: var(--yellow);
  border-radius: 7px;
  font-weight: 500;
}

h1 {
  margin: 34px 20px 21px;
  font-family: var(--hand);
  font-size: clamp(36px, 2.85vw, 60px);
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: .025em;
  text-align: center;
}

.recipe-form { width: 100%; }

.paper {
  position: relative;
  width: min(80vw, 1630px);
  aspect-ratio: 2048 / 1061;
  margin-inline: auto;
  isolation: isolate;
}

.paper__art {
  position: absolute;
  z-index: -1;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  user-select: none;
}

.field { position: absolute; min-width: 0; }

.hand-title {
  display: block;
  margin: 0;
  font-family: var(--hand);
  font-size: clamp(18px, 1.64vw, 34px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: .005em;
}

.mono-title {
  display: block;
  margin: 0;
  font-family: var(--mono);
  font-size: clamp(18px, 1.5vw, 31px);
  line-height: 1.3;
  font-weight: 400;
}

.field--dish {
  left: 6.28%;
  top: 13.5%;
  width: 36.25%;
}

.line-input {
  width: 100%;
  height: clamp(28px, 3.4vw, 70px);
  padding: 3px 4px 1px;
  border: 0;
  border-bottom: 2px dotted var(--ink);
  border-radius: 0;
  outline-offset: 4px;
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: clamp(16px, 1.3vw, 26px);
}

.line-input:focus-visible { outline: 2px solid #4f4538; }

.field--ingredients {
  left: 6.3%;
  top: 29.3%;
  width: 36.25%;
}

.ingredients-area {
  display: block;
  width: 100%;
  height: clamp(80px, 8.45vw, 175px);
  margin-top: 17px;
  padding: 14px 16px;
  resize: none;
  outline-offset: 3px;
  border: 2px solid #3e3b3b;
  border-right: 1px solid #888;
  border-bottom: 2px solid #3e3b3b;
  border-radius: 15px;
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: clamp(15px, 1.12vw, 22px);
  line-height: 1.3;
}

.who-title {
  position: absolute;
  left: 6.3%;
  top: 59.6%;
}

.field--people {
  left: 6.3%;
  top: 67.4%;
  width: 36.25%;
}

.field--origin {
  left: 6.3%;
  top: 77.2%;
  width: 36.25%;
}

.field--people .line-input, .field--origin .line-input {
  height: clamp(20px, 1.45vw, 30px);
}

.writing-panel {
  position: absolute;
  left: 46.47%;
  top: 8.65%;
  width: 49.2%;
  height: 59.45%;
  padding: 4.6% 3.1% 1.1%;
  border: 2px solid #393334;
  border-radius: 5.5% / 10%;
  background: #fff;
  display: grid;
  grid-template-rows: 49.5% 50.5%;
  min-width: 0;
}

.writing-group { min-height: 0; display: flex; flex-direction: column; }
.writing-group .hand-title { flex: 0 0 auto; }

.text-with-counter {
  position: relative;
  flex: 1;
  min-height: 0;
  margin-top: 6%;
  padding-left: 2.3%;
  border-left: 3px solid #353032;
}

.character-count {
  display: block;
  height: 25%;
  font-family: var(--mono);
  font-size: clamp(16px, 1.47vw, 30px);
  line-height: 1.1;
}

.text-with-counter textarea {
  display: block;
  width: 100%;
  height: 75%;
  padding: 0 4px;
  border: 0;
  resize: none;
  outline-offset: 2px;
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: clamp(14px, 1.15vw, 23px);
  line-height: 1.35;
}

.writing-group--memories { padding-top: 1%; }
.writing-group--memories .text-with-counter { margin-top: 3.5%; }

.upload-panel {
  position: absolute;
  left: 46.5%;
  top: 71.45%;
  width: 49.2%;
  height: 21.85%;
  overflow: hidden;
  border: 2px solid #3e3939;
  border-radius: 18px;
  background: white;
}

.upload-panel input[type=file] {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.upload-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 8px;
  cursor: pointer;
  color: var(--ink);
  font-family: var(--mono);
  font-size: clamp(15px, 1.5vw, 31px);
  text-align: center;
  gap: 12%;
}

.upload-label:hover { background: #fffef3; }
.upload-panel:focus-within { outline: 3px solid #51483f; outline-offset: 3px; }

.polaroid {
  display: grid;
  place-items: center;
  width: clamp(48px, 5.65vw, 116px);
  height: clamp(46px, 4.95vw, 102px);
  padding: 8px 8px 18px;
  border: 2px solid #181415;
  background: var(--yellow);
  transform: rotate(-7deg);
  flex: 0 0 auto;
}

.polaroid__photo {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  background: #141112;
  color: #fff;
  font-family: serif;
  font-size: clamp(27px, 2.7vw, 56px);
}

.upload-preview {
  display: block;
  max-height: 100%;
  max-width: 100%;
  object-fit: contain;
  border-radius: 9px;
}

[hidden] { display: none !important; }

input[aria-invalid="true"], textarea[aria-invalid="true"] {
  outline: 3px solid #ad352b;
  outline-offset: 3px;
}

.form-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  min-height: 125px;
  padding: 22px 20px 45px;
}

.submit-button {
  display: inline-flex;
  align-items: center;
  gap: 21px;
  padding: 14px 25px 16px;
  border: 3px solid #171213;
  border-radius: 12px;
  background: #171213;
  color: var(--yellow);
  font-family: var(--hand);
  font-size: clamp(22px, 1.5vw, 30px);
  box-shadow: 4px 5px 0 #7e744b;
  transition: transform 150ms ease, box-shadow 150ms ease;
}

.submit-button:hover { transform: translate(-2px, -2px); box-shadow: 6px 7px 0 #7e744b; }
.submit-button:disabled { opacity: .65; cursor: wait; }
.submit-button span { font-family: var(--sans); }

.form-status {
  margin: 0;
  max-width: 700px;
  min-height: 1.5em;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
}

.form-status[data-type="error"] { color: #89251e; }
.form-status[data-type="success"] { color: #165c34; }
.form-status[data-type="pending"] { color: #4c3b18; }

.navigation-note {
  position: fixed;
  z-index: 50;
  right: 20px;
  bottom: 20px;
  max-width: 350px;
  padding: 15px 18px;
  border: 2px solid var(--yellow);
  border-radius: 12px;
  background: var(--ink);
  color: var(--yellow);
  font-size: 15px;
  box-shadow: 0 5px 16px #18141535;
}

.decor--spoon {
  left: 0;
  top: 86px;
  width: 250px;
  height: 225px;
  background-position: 0 -86px;
  clip-path: polygon(0 0, 100% 0, 100% 52%, 65% 75%, 38% 100%, 0 100%);
}

.decor--plate {
  right: 0;
  top: 0;
  width: 242px;
  height: 165px;
  background-position: -1806px 0;
}

.decor--bottom {
  right: 0;
  top: 965px;
  width: 207px;
  height: 187px;
  background-position: -1841px -965px;
}

@media (max-width: 1900px) {
  .decor--bottom { display: none; }
}

@media (max-width: 1450px) {
  .decor--spoon { display: none; }
  .decor--plate { transform: scale(.68); transform-origin: top right; }
  .ingredients-area { margin-top: 10px; }
  .writing-panel { padding-top: 4%; }
}

@media (max-width: 1200px) {
  h1 { margin-top: 29px; margin-bottom: 20px; }
  .paper { width: min(92vw, 760px); aspect-ratio: auto; padding: 58px 8% 75px; }
  .paper__art { object-fit: fill; }
  .field, .who-title, .writing-panel, .upload-panel { position: relative; inset: auto; width: 100%; height: auto; }
  .paper { display: flex; flex-direction: column; gap: 25px; }
  .field { flex: 0 0 auto; }
  .hand-title { font-size: clamp(23px, 4vw, 31px); }
  .mono-title { font-size: clamp(20px, 3.2vw, 28px); }
  .line-input { height: 48px; font-size: 19px; }
  .field--ingredients .ingredients-area { height: 160px; font-size: 18px; margin-top: 12px; }
  .who-title { margin-top: 4px; margin-bottom: -12px; }
  .writing-panel { display: flex; flex-direction: column; gap: 20px; padding: 26px; border-radius: 28px; }
  .writing-group { height: 230px; }
  .text-with-counter { margin-top: 14px; padding-left: 14px; }
  .writing-group--memories .text-with-counter { margin-top: 14px; }
  .character-count { font-size: 21px; height: 30px; }
  .text-with-counter textarea { height: calc(100% - 30px); font-size: 17px; }
  .upload-panel { min-height: 185px; }
  .upload-label { gap: 13px; font-size: clamp(17px, 3vw, 24px); }
  .polaroid { width: 88px; height: 82px; }
  .polaroid__photo { font-size: 40px; }
}

@media (max-width: 600px) {
  .decor { display: none; }
  .top-nav { height: 70px; margin-top: 12px; padding: 7px; border-width: 4px; }
  .nav-item { font-size: clamp(14px, 4.2vw, 20px); }
  h1 { margin: 27px 14px 19px; font-size: clamp(34px, 10vw, 47px); }
  .paper { width: min(96vw, 560px); padding: 48px 8% 68px; gap: 21px; }
  .writing-panel { padding: 20px 18px; }
  .writing-group { height: 200px; }
  .ingredients-area { max-height: 155px; }
  .upload-panel { min-height: 155px; }
  .polaroid { width: 68px; height: 65px; padding: 5px 5px 12px; }
  .polaroid__photo { font-size: 30px; }
  .form-actions { padding-top: 16px; }
}

</style>

                <span id="preparation-counter" class="character-count" aria-live="off">0/2000</span>
                <textarea id="preparation" name="preparacion" maxlength="2000" rows="4" required aria-required="true" aria-describedby="preparation-counter"></textarea>
              </div>
            </div>
            <div class="writing-group writing-group--memories">
              <label class="hand-title" for="memories">Memorias</label>
              <div class="text-with-counter">
                <span id="memories-counter" class="character-count" aria-live="off">0/2000</span>
                <textarea id="memories" name="memorias" maxlength="2000" rows="4" required aria-required="true" aria-describedby="memories-counter"></textarea>
              </div>
            </div>
          </div>

          <div class="upload-panel">
            <input id="photo" name="foto" type="file" accept="image/jpeg,image/png,image/webp" required aria-required="true" />
            <label class="upload-label" for="photo">
              <span class="polaroid" aria-hidden="true"><span class="polaroid__photo">♨</span></span>
              <span id="upload-text">Sube una Foto de la preparación</span>
              <img id="upload-preview" class="upload-preview" alt="Vista previa de la fotografía seleccionada" hidden />
            </label>
          </div>
        </section>

        <div class="form-actions">
          <button class="submit-button" type="submit" id="submit-button">Compartir receta <span aria-hidden="true">↗</span></button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </main>

    <div id="navigation-note" class="navigation-note" role="status" aria-live="polite" hidden></div>
    <script>
/*
 * Cuando exista el servicio que escribirá en Google Sheets, pega su URL aquí.
 * Debe aceptar POST JSON y devolver JSON { ok: true } al guardar correctamente.
 * Hasta que esté configurado, ninguna receta se envía ni se presenta como guardada.
 */
window.MEMORIA_GASTRONOMICA = {
  submitEndpoint: "https://script.google.com/macros/s/AKfycbwaRHibA2rGCA43Q4Ce43cEttGHrPnORApPk_jh3ExLA2OIy-H5dn1tqq1gbmTOWXlRAg/exec"
};

</script>
    <script>
(() => {
  "use strict";

  const form = document.querySelector("#recipe-form");
  const status = document.querySelector("#form-status");
  const button = document.querySelector("#submit-button");
  const photo = document.querySelector("#photo");
  const preview = document.querySelector("#upload-preview");
  const uploadText = document.querySelector("#upload-text");
  const endpoint = String(window.MEMORIA_GASTRONOMICA?.submitEndpoint ?? "").trim();
  let photoPreviewUrl = "";
  let currentSubmissionId = "";
  let statusRequestNumber = 0;

  function setStatus(message, type = "info") {
    status.textContent = message;
    status.dataset.type = type;
  }

  function attachCounter(fieldId, counterId) {
    const field = document.getElementById(fieldId);
    const counter = document.getElementById(counterId);
    const update = () => {
      counter.textContent = `${field.value.length}/${field.maxLength}`;
    };
    field.addEventListener("input", update);
    update();
  }

  attachCounter("preparation", "preparation-counter");
  attachCounter("memories", "memories-counter");

  photo.addEventListener("change", () => {
    currentSubmissionId = "";
    if (photoPreviewUrl) URL.revokeObjectURL(photoPreviewUrl);
    photoPreviewUrl = "";
    preview.hidden = true;
    uploadText.hidden = false;
    photo.removeAttribute("aria-invalid");

    const file = photo.files?.[0];
    if (!file) return;
    const allowed = ["image/jpeg", "image/png", "image/webp"];
    if (!allowed.includes(file.type) || file.size > 5 * 1024 * 1024) {
      photo.value = "";
      setStatus("La fotografía debe ser JPG, PNG o WEBP y pesar máximo 5 MB.", "error");
      photo.focus();
      return;
    }

    photoPreviewUrl = URL.createObjectURL(file);
    preview.src = photoPreviewUrl;
    preview.hidden = false;
    uploadText.hidden = true;
    setStatus(`Fotografía seleccionada: ${file.name}`, "info");
  });

  form.addEventListener("input", event => {
    if (event.target.matches("input, textarea")) {
      event.target.removeAttribute("aria-invalid");
      currentSubmissionId = "";
    }
  });

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = () => reject(new Error("No se pudo leer la fotografía."));
      reader.readAsDataURL(file);
    });
  }

  // La respuesta POST de Apps Script no se puede leer directamente desde
  // otro origen. Enviamos texto simple y comprobamos el guardado con un GET
  // JSONP de solo lectura, que no entrega datos personales de la receta.
  function consultarEstadoGuardado(id) {
    return new Promise((resolve, reject) => {
      const callbackName = `__memoriaEstado${++statusRequestNumber}`;
      const script = document.createElement("script");
      const url = new URL(endpoint);
      let timer;
      let finished = false;

      function finish(error, resultado) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        script.remove();
        delete window[callbackName];
        if (error) reject(error);
        else resolve(resultado?.guardada === true);
      }

      window[callbackName] = resultado => finish(null, resultado);
      script.onerror = () => finish(new Error("No se pudo consultar el estado del envío."));
      timer = setTimeout(() => finish(new Error("Se agotó el tiempo de comprobación.")), 9000);
      url.searchParams.set("accion", "estado");
      url.searchParams.set("id", id);
      url.searchParams.set("callback", callbackName);
      url.searchParams.set("t", String(Date.now()));
      script.src = url.toString();
      document.head.appendChild(script);
    });
  }

  async function confirmarGuardado(id) {
    for (let intento = 0; intento < 6; intento++) {
      try {
        if (await consultarEstadoGuardado(id)) return true;
      } catch (error) {
        // Un fallo temporal en la comprobación no significa que el POST falló.
        if (intento === 5) return false;
      }
      if (intento < 5) await new Promise(resolve => setTimeout(resolve, 1200));
    }
    return false;
  }

  function generarIdReceta() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    if (!window.crypto?.getRandomValues) {
      throw new Error("Este navegador no permite crear un identificador seguro.");
    }
    const bytes = new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = Array.from(bytes, number => number.toString(16).padStart(2, "0")).join("");
    return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    setStatus("");

    const requiredFields = ["dish-name", "ingredients", "people", "origin", "preparation", "memories", "photo"];
    const invalid = requiredFields.map(id => document.getElementById(id)).find(field => !field.value.trim());

    if (invalid) {
      invalid.setAttribute("aria-invalid", "true");
      setStatus("Completa todos los espacios y elige una fotografía para compartir tu receta.", "error");
      invalid.focus();
      return;
    }

    if (!endpoint) {
      setStatus("Tu formulario está completo, pero todavía falta configurar la dirección de Apps Script. No se ha enviado ninguna receta.", "pending");
      return;
    }

    let url;
    try {
      url = new URL(endpoint);
    } catch {
      setStatus("La dirección de Apps Script no es válida. No se ha enviado ninguna receta.", "error");
      return;
    }
    if (url.protocol !== "https:" || url.hostname !== "script.google.com" || !url.pathname.endsWith("/exec")) {
      setStatus("Usa la dirección HTTPS de Apps Script que termina en /exec.", "error");
      return;
    }

    const file = photo.files?.[0];
    if (!file) return;
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type) || file.size > 5 * 1024 * 1024) {
      setStatus("La fotografía debe ser JPG, PNG o WEBP y pesar máximo 5 MB.", "error");
      return;
    }
    if (form.elements.namedItem("ingredientes").value.length > 3000) {
      setStatus("Los ingredientes no pueden superar 3000 caracteres.", "error");
      return;
    }
    const textoDemasiadoLargo = ["preparacion", "memorias"]
      .map(nombre => form.elements.namedItem(nombre))
      .find(campo => campo.value.length > campo.maxLength);
    if (textoDemasiadoLargo) {
      setStatus("Preparación y memorias admiten hasta 2000 caracteres cada una.", "error");
      textoDemasiadoLargo.focus();
      return;
    }
    button.disabled = true;
    button.textContent = "Enviando receta…";

    try {
      if (!currentSubmissionId) currentSubmissionId = generarIdReceta();
      const payload = {
        id: currentSubmissionId,
        nombre_plato: form.elements.namedItem("nombre_plato").value.trim(),
        ingredientes: form.elements.namedItem("ingredientes").value.trim(),
        nombres: form.elements.namedItem("nombres").value.trim(),
        origen_plato: form.elements.namedItem("origen_plato").value.trim(),
        preparacion: form.elements.namedItem("preparacion").value.trim(),
        memorias: form.elements.namedItem("memorias").value.trim(),
        foto: {
          nombre: file.name,
          tipo: file.type,
          base64: await toBase64(file)
        }
      };

      // El modo no-cors envía el POST, pero NO confirma que se haya guardado.
      // Solo mostraremos éxito si la consulta posterior encuentra el ID.
      await fetch(endpoint, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify(payload)
      });

      setStatus("Receta enviada. Comprobando que se guardó correctamente…", "pending");
      const guardada = await confirmarGuardado(currentSubmissionId);
      if (!guardada) {
        throw new Error("No pudimos confirmar el guardado. Puedes volver a intentarlo sin perder los datos.");
      }

      setStatus("¡Tu receta se recibió correctamente! Quedará pendiente de revisión antes de publicarse.", "success");
      form.reset();
      currentSubmissionId = "";
      for (const id of ["preparation", "memories"]) {
        document.getElementById(id).dispatchEvent(new Event("input"));
      }
      if (photoPreviewUrl) URL.revokeObjectURL(photoPreviewUrl);
      photoPreviewUrl = "";
      preview.hidden = true;
      uploadText.hidden = false;
    } catch (error) {
      setStatus(`No se pudo confirmar el envío. ${error.message} Se conservaron los datos del formulario.`, "error");
    } finally {
      button.disabled = false;
      button.innerHTML = 'Compartir receta <span aria-hidden="true">↗</span>';
    }
  });

  const navigationNote = document.querySelector("#navigation-note");
  let noteTimer;
  document.querySelectorAll("[data-coming-soon]").forEach(item => {
    item.addEventListener("click", () => {
      navigationNote.textContent = `La sección «${item.dataset.comingSoon}» se conectará cuando reunamos las páginas.`;
      navigationNote.hidden = false;
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => { navigationNote.hidden = true; }, 4500);
    });
  });

  window.addEventListener("pagehide", () => {
    if (photoPreviewUrl) URL.revokeObjectURL(photoPreviewUrl);
  });
})();

</script>
  </body>
</html>
